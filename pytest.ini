[pytest]
testpaths = features
pythonpath = .
addopts = -v --alluredir=reports/allure-results --clean-alluredir
log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
bdd_features_base_dir = features
markers =
    login: login related scenarios
